version = 1
updated = 2026-07-29

[[term]]
term = ".sova"
definition = "A portable declarative adversarial scenario. It has executable intent only through an explicit validated, bound, and authorized SOVA run."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = ".sova-trace"
definition = "The inert canonical record of one execution, including ordered observations, input bindings, redactions, completion state, artifacts, and integrity material."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "Atlas MCP"
definition = "An optional replaceable execution provider for browser, computer, and terminal use; it is not SOVA's security, evidence, authorization, or attestation architecture."
status = "accepted"
source = "decisions/0005-topic-00-project-constitution.md"

[[term]]
term = "attestation"
definition = "An independently governed claim on which another party may rely. SOVA OSS does not issue TRUSCOR attestations."
status = "accepted"
source = "decisions/0004-self-assessment-and-truscor-boundary.md"

[[term]]
term = "controlled re-execution"
definition = "A fresh run of the same scenario under pinned or explicitly equivalent conditions."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "ExecutorAdapter"
definition = "A replaceable public boundary through which SOVA requests bounded execution capabilities without transferring SOVA's safety or evidence responsibilities."
status = "accepted"
source = "decisions/0007-topic-02-engineering-foundation.md"

[[term]]
term = "finding"
definition = "A versioned security conclusion supported by named scenario and trace digests, with lifecycle, uncertainty, severity, and limitation metadata."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "LocalSandboxExecutor"
definition = "The planned SOVA-owned restricted local executor used for the no-Atlas vertical slice."
status = "planned"
source = "decisions/0006-topic-01-evidence-go-no-go.md"

[[term]]
term = "map report"
definition = "An inert capability and inventory graph that distinguishes declared, observed, inferred, and unknown reach with provenance."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "portable vulnerability artifact"
definition = "A scenario whose immutable digest is cited by a lifecycle-qualified finding supported by trace evidence; a scenario alone is not a confirmed vulnerability."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "registry entry"
definition = "Inert discovery and lifecycle metadata that points to immutable scenario content and verification records without executing it."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "report"
definition = "A derived human or ecosystem view of canonical artifacts; it is not an evidence root."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "ScriptedExecutor"
definition = "A planned deterministic executor used to test SOVA orchestration, observations, and failure behavior without live external systems."
status = "planned"
source = "decisions/0006-topic-01-evidence-go-no-go.md"

[[term]]
term = "self-assessment"
definition = "Evidence generated by an operator about a system they control, without independent TRUSCOR review or third-party reliance."
status = "accepted"
source = "decisions/0004-self-assessment-and-truscor-boundary.md"

[[term]]
term = "semantic reproduction"
definition = "Repeatedly testing whether the same material security outcome recurs when bit-for-bit replay is unavailable, with conditions, trials, and uncertainty reported."
status = "planned"
source = "decisions/0002-versioning-and-lossless-migration.md"

[[term]]
term = "SOVA Engine"
definition = "TRUSCOR's separate proprietary system; it is not the public SOVA OSS runtime or a hidden dependency of it."
status = "accepted"
source = "decisions/0003-open-source-and-proprietary-boundary.md"

[[term]]
term = "SOVA OSS"
definition = "The complete local-first open-source instrument for authorized AI-agent security mapping, testing, evidence, replay, and analysis."
status = "accepted"
source = "decisions/0005-topic-00-project-constitution.md"

[[term]]
term = "SOVA OSS Core"
definition = "The public runtime and architecture owned by this repository; also called SOVA Runtime."
status = "accepted"
source = "decisions/0003-open-source-and-proprietary-boundary.md"

[[term]]
term = "target manifest"
definition = "An inert local declaration of target interfaces, adapters, expected capabilities, entry points, and secret references; it is not authorization."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "trace playback"
definition = "Deterministic inspection of the observations already recorded in a trace; it never operates the original target."
status = "accepted"
source = "decisions/0001-canonical-artifact-meanings.md"

[[term]]
term = "TRUSCOR"
definition = "The company that maintains SOVA OSS and separately operates proprietary systems and independent commercial processes outside this repository."
status = "accepted"
source = "decisions/0004-self-assessment-and-truscor-boundary.md"
