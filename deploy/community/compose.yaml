name: sova-community

services:
  registry-data-init:
    image: ${SOVA_IMAGE:?set SOVA_IMAGE to an immutable digest-pinned image}
    restart: "no"
    init: true
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    volumes:
      - registry-data:/var/lib/sova
      - registry-operator:/run/sova/operator
      - type: bind
        source: ${SOVA_OPERATOR_DIR:?set SOVA_OPERATOR_DIR to an absolute directory outside the repository}
        target: /run/sova/source
        read_only: true
    entrypoint:
      - /bin/sh
      - -eu
      - -c
    command:
      - |
        chown -R 65532:65532 /var/lib/sova
        chmod 0750 /var/lib/sova
        touch /var/lib/sova/.sova-volume-owner-v1
        chown 65532:65532 /var/lib/sova/.sova-volume-owner-v1
        chmod 0640 /var/lib/sova/.sova-volume-owner-v1
        install -d -o 65532 -g 65532 -m 0700 /run/sova/operator
        install -o 65532 -g 65532 -m 0400 /run/sova/source/service.token /run/sova/operator/service.token
        install -o 65532 -g 65532 -m 0400 /run/sova/source/methodology.md /run/sova/operator/methodology.md

  registry:
    image: ${SOVA_IMAGE:?set SOVA_IMAGE to an immutable digest-pinned image}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "443:443"
    depends_on:
      registry-data-init:
        condition: service_completed_successfully
    volumes:
      - registry-data:/var/lib/sova
      - registry-operator:/run/sova/operator:ro
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    command:
      - registry
      - serve
      - /var/lib/sova
      - --token-file
      - /run/sova/operator/service.token
      - --trusted-key-id
      - ${SOVA_TRUSTED_EVIDENCE_KEY_ID:?set trusted evidence key id}
      - --methodology
      - /run/sova/operator/methodology.md
      - --host
      - 127.0.0.1
      - --port
      - "8736"
    healthcheck:
      test:
        - CMD
        - sova
        - registry
        - healthcheck
        - --url
        - http://127.0.0.1:8736/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  edge:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE to an immutable digest-pinned image}
    restart: unless-stopped
    network_mode: service:registry
    depends_on:
      registry:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      SOVA_COMMUNITY_DOMAIN: ${SOVA_COMMUNITY_DOMAIN:?set public domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev

volumes:
  registry-data: {}
  registry-operator: {}
  caddy-data: {}
  caddy-config: {}
