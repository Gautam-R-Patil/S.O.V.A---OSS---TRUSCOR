name: Public repository boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    name: Check public boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan tracked paths and content
        shell: pwsh
        run: ./scripts/check-public-boundary.ps1
