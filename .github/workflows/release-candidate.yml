name: Release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    name: Build without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize and test
        run: |
          uv sync --locked
          uv run --locked python -m pytest
          uv run --locked python scripts/check_repository.py

      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --locked python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Build candidate
        run: uv build

      - name: Generate deterministic SBOM and candidate checksums
        run: |
          uv run --locked sova release sbom uv.lock dist/sova-oss.cdx.json --scope runtime
          uv run --locked sova release checksums dist dist/SHA256SUMS
          uv run --locked sova release verify-checksums dist dist/SHA256SUMS

      - name: Attest candidate provenance
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: dist/*

      - name: Retain candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sova-oss-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
