name: Signed release candidate

on:
  workflow_dispatch:
    inputs:
      acknowledge_experimental:
        description: Type I UNDERSTAND THIS IS NOT 1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-sign-attest:
    if: inputs.acknowledge_experimental == 'I UNDERSTAND THIS IS NOT 1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize exact environment
        run: uv sync --locked

      - name: Install pinned mediator build and audit toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl

      - name: Verify and build the network mediator
        working-directory: deploy/worker/network-mediator
        run: |
          cargo +1.88.0 fmt --check
          cargo +1.88.0 clippy --locked --all-targets -- -D warnings
          cargo +1.88.0 test --locked
          cargo +1.88.0 install cargo-audit --locked --version 0.22.2
          cargo +1.88.0 audit --deny warnings
          cargo +1.88.0 build --locked --release --target x86_64-unknown-linux-musl

      - name: Require repository and stable-gate tests
        run: |
          uv run --locked python -m pytest
          uv run --locked python scripts/check_repository.py
          uv run --locked sova acceptance run .candidate-acceptance
          test "$(python -c 'import json; print(json.load(open(".candidate-acceptance/stable-readiness.json"))["readyForStable1"])')" = "False"

      - name: Build distributions and release metadata
        run: |
          uv build
          install -m 0755 deploy/worker/network-mediator/target/x86_64-unknown-linux-musl/release/sova-network-mediator dist/sova-network-mediator-x86_64-unknown-linux-musl
          uv run --locked sova release sbom uv.lock dist/sova-oss.cdx.json --scope runtime
          uv run --locked sova release cargo-sbom deploy/worker/network-mediator/Cargo.lock dist/sova-network-mediator.cdx.json --root sova-network-mediator
          uv run --locked sova release checksums dist dist/SHA256SUMS
          uv run --locked sova release verify-checksums dist dist/SHA256SUMS

      - name: Keyless-sign candidate artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/sova-network-mediator-x86_64-unknown-linux-musl
            dist/sova-network-mediator.cdx.json
            dist/sova-oss.cdx.json
            dist/SHA256SUMS
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release-candidate.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: true
          release-signing-artifacts: false

      - name: Create GitHub build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload candidate bundle for founder review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sova-oss-experimental-candidate-${{ github.sha }}
          path: |
            dist/
            .candidate-acceptance/report.json
            .candidate-acceptance/stable-readiness.json
          if-no-files-found: error
          retention-days: 14
