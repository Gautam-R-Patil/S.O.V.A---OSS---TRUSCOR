name: Release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    name: Build without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize and test
        run: |
          uv sync --locked
          uv run --locked python -m pytest
          uv run --locked python scripts/check_repository.py

      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --locked python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Build candidate
        run: uv build

      - name: Generate deterministic SBOM and candidate checksums
        run: |
          uv run --locked sova release sbom uv.lock dist/sova-oss.cdx.json --scope runtime
          uv run --locked sova release checksums dist dist/SHA256SUMS
          uv run --locked sova release verify-checksums dist dist/SHA256SUMS

      - name: Attest candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Retain candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sova-oss-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
