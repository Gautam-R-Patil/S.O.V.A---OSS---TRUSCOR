name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  SOVA_TEST_SEED: "20260729"
  UV_LOCKED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Check lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint source and tests
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked mypy

      - name: Test with branch coverage
        run: >-
          uv run --locked python -m pytest
          --cov=sova
          --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=95

      - name: Require every registered CLI command handler to execute
        run: uv run --locked python scripts/audit_cli_coverage.py coverage.json

      - name: Run credential-free acceptance lab
        run: |
          uv run --locked sova acceptance run .ci-acceptance
          uv run --locked python -c "import json; report=json.load(open('.ci-acceptance/report.json')); assert report['coreAcceptancePassed'] is True; assert report['stable1Ready'] is False"

      - name: Check generated glossary
        run: uv run --locked python scripts/generate_glossary.py --check

      - name: Check generated attack taxonomy
        run: uv run --locked python scripts/generate_taxonomy.py --check

      - name: Check repository policy
        run: uv run --locked python scripts/check_repository.py

      - name: Audit Python dependencies
        run: |
          uv export --locked --quiet --format requirements.txt --all-groups --no-emit-project --output-file audit-requirements.txt
          uv run --locked pip-audit --strict --progress-spinner off --vulnerability-service osv --requirement audit-requirements.txt --no-deps --disable-pip

      - name: Build source and wheel distributions
        run: uv build

      - name: Smoke-test built wheel
        shell: bash
        run: uv run --isolated --no-project --python 3.11 --with "$(find dist -name '*.whl' -print -quit)" sova --version

  platform:
    name: Platform (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            shard: all
          - os: ubuntu-latest
            python: "3.12"
            shard: all
          - os: ubuntu-latest
            python: "3.13"
            shard: all
          - os: ubuntu-latest
            python: "3.14"
            shard: all
          # The Windows 2025/VS2026 hosted image currently injects an unsolicited
          # console interrupt into Python subprocess tests. Pin the supported
          # Windows 2022 image so this compatibility lane remains reproducible.
          - os: windows-2022
            python: "3.11"
            shard: first
          - os: windows-2022
            python: "3.14"
            shard: first
          - os: windows-2022
            python: "3.11"
            shard: second-a
          - os: windows-2022
            python: "3.14"
            shard: second-a
          - os: windows-2022
            python: "3.11"
            shard: second-b
          - os: windows-2022
            python: "3.14"
            shard: second-b
          - os: windows-2022
            python: "3.11"
            shard: extensions
          - os: windows-2022
            python: "3.14"
            shard: extensions
          - os: windows-2022
            python: "3.11"
            shard: process-control
          - os: windows-2022
            python: "3.14"
            shard: process-control
          - os: macos-latest
            python: "3.11"
            shard: all
          - os: macos-latest
            python: "3.14"
            shard: all
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Run complete test suite
        if: matrix.shard == 'all'
        run: uv run --locked python -m pytest

      - name: Run Windows test shard 1
        if: matrix.shard == 'first'
        shell: pwsh
        run: |
          # Each Windows shard receives a fresh hosted runner. Together the five
          # partitions remain exhaustive; no test is omitted or marked optional.
          $unitFiles = Get-ChildItem tests/unit/test_*.py |
            Where-Object { $_.Name -lt 'test_held_out_web.py' } |
            ForEach-Object { $_.FullName }
          .venv\Scripts\python.exe -m pytest tests/compat tests/failure tests/integration tests/performance @unitFiles

      - name: Run Windows test shard 2a
        if: matrix.shard == 'second-a'
        shell: pwsh
        run: |
          $unitFiles = Get-ChildItem tests/unit/test_*.py |
            Where-Object {
              $_.Name -ge 'test_held_out_web.py' -and
              $_.Name -lt 'test_topic_23_community.py' -and
              $_.Name -ne 'test_topic_22_extensions_interop.py' -and
              $_.Name -ne 'test_topics_18_20_edges.py'
            } |
            ForEach-Object { $_.FullName }
          .venv\Scripts\python.exe -m pytest @unitFiles

      - name: Run Windows test shard 2b
        if: matrix.shard == 'second-b'
        shell: pwsh
        run: |
          $unitFiles = Get-ChildItem tests/unit/test_*.py |
            Where-Object {
              $_.Name -ge 'test_topic_23_community.py' -and
              $_.Name -ne 'test_topics_18_20_edges.py'
            } |
            ForEach-Object { $_.FullName }
          .venv\Scripts\python.exe -m pytest @unitFiles

      - name: Run Windows extension interoperability shard
        if: matrix.shard == 'extensions'
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pytest --full-trace tests/unit/test_topic_22_extensions_interop.py

      - name: Run Windows process-control shard
        if: matrix.shard == 'process-control'
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pytest --full-trace tests/unit/test_topics_18_20_edges.py

      - name: Build package
        run: uv build

      - name: Exercise CLI
        run: uv run --locked sova --version

      - name: Run platform acceptance lab
        run: uv run --locked sova acceptance run .platform-acceptance

  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_dco.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Confirm direct-push convention
        if: github.event_name != 'pull_request'
        run: python -c "print('DCO_CHECK=NOT_APPLICABLE_TO_PUSH_RANGE')"

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, platform, dco]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          QUALITY: ${{ needs.quality.result }}
          PLATFORM: ${{ needs.platform.result }}
          DCO: ${{ needs.dco.result }}
        run: |
          test "$QUALITY" = "success"
          test "$PLATFORM" = "success"
          test "$DCO" = "success"
