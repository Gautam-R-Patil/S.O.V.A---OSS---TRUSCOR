version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      python-development:
        patterns: ["*"]
    labels: ["dependencies", "python"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: cargo
    directory: /deploy/worker/network-mediator
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      mediator-rust:
        patterns: ["*"]
    labels: ["dependencies", "rust", "security-boundary"]
